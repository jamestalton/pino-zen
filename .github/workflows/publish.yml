name: NPM Publish
on:
    workflow_dispatch:
        inputs:
            versionIncrement:
                description: 'Version Increment (none publishes the current package.json version)'
                required: true
                default: 'patch'
                type: choice
                options:
                    - major
                    - minor
                    - patch
                    - none
permissions:
    contents: write
    id-token: write # npm trusted publishing (OIDC)

jobs:
    npm-publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '24' # trusted publishing needs npm >= 11.5.1
                  registry-url: https://registry.npmjs.org/
            - name: npm version ${{ github.event.inputs.versionIncrement }}
              if: github.event.inputs.versionIncrement != 'none'
              run: |
                  TAG=$(npm version ${{ github.event.inputs.versionIncrement }} --no-git-tag-version)
                  echo "TAG=$(echo $TAG)" >> $GITHUB_ENV
            - run: npm ci
            - run: npm test
            - run: npm run build
            - uses: EndBug/add-and-commit@v11
              if: github.event.inputs.versionIncrement != 'none'
              with:
                  default_author: github_actions
                  message: Release ${{ env.TAG }}
                  tag: ${{ env.TAG }}
            - run: npm publish
